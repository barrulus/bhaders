name: Validate catalogue
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/document.py
      - run: git diff --exit-code
      - run: python3 -m unittest discover -s tests -v
